{% extends "layout.html" %}
{% block body %}
<!-- homepage goes here-->
<!-- a column grid-->
 <div class="single-column">
    {% for recipe in results %}
    <a href="{{ url_for('recipe', id=recipe[0]) }}" class="category-header">
        <div class="w3-card-4" style="margin-bottom: 20px; padding: 15px">
            <!-- the name -->
             <h2>{{ recipe[1] }}</h2>
             <!--smaller font-->
             <p style="font-size: 16px;">{{ recipe[2] }}</p>
             <!--the image-->
             {% if recipe[3] %}
                <img src="{{ recipe[3] }}" alt="{{recipe[1] }}" class= 'recipeimg'>
            {% endif %}
         </div>
    </a>
         {% endfor %}
</div>
{% endblock %}
