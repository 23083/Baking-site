{% extends "layout.html" %}
{% block body %}
<!-- homepage goes here-->
 <!-- a 3 column grid -->
  <div class="three-column">
    {% for recipe in results %}
    <a href="{{ url_for('recipe', id=recipe[0]) }}">
    <div class="w3-card-4">
              <!-- the name then the image -->
         <h1> {{ recipe[1] }} {{ recipe[2] }}</h1>
         <img src="{{ recipe[3] }}" alt="{{ recipe[2] }}">
   </div>
    </a>
    {% endfor %}
  </div>

{% endblock %}
